
name: Offline tests (no models or user audio)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: whisper-zh-ru-meeting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Publishing safety check
        run: python check_publication.py

      - name: Third-party attribution check
        run: python check_third_party_attributions.py

      - name: Python syntax check
        run: python -m compileall -q .

      - name: Offline unit tests
        run: python -m unittest -v test_v335
